services:
  rustfs:
    image: rustfs/rustfs:1.0.3
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 1s
      retries: 30

  # object_store has no bucket API. Re-running against an existing bucket is harmless, so the
  # HTTP status is not checked.
  create-bucket:
    image: rustfs/rustfs:1.0.3
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint:
      - curl
      - -sS
      - --aws-sigv4
      - aws:amz:us-east-1:s3
      - --user
      - rustfsadmin:rustfsadmin
      - -X
      - PUT
      - http://rustfs:9000/warehouse

volumes:
  rustfs-data:
