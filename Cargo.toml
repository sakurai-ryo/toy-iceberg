[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
toy-iceberg-core = { path = "crates/core" }
toy-iceberg-datafusion = { path = "crates/datafusion" }
apache-avro = { version = "0.22", features = ["snappy", "zstandard"] }
arrow = "59.2"
async-trait = "0.1"
bytes = "1"
chrono = "0.4"
datafusion = "55.2"
futures = "0.3"
object_store = { version = "0.13", features = ["aws"] }
percent-encoding = "2"
parquet = { version = "59.2", features = ["arrow", "async", "object_store", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "v7"] }

# DataFusion and iceberg-rust in one unoptimized test binary push __eh_frame past the 16MB that
# macOS ld can index in its compact unwind table. Optimizing dependencies keeps it under the limit.
[profile.dev.package."*"]
opt-level = 1
